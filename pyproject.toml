[project]
name = "ml4nu"
version = "0.1.0"
description = "Tutorials for learning neutrino-nucleus cross sections and fitting oscillations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.14",
    "torch>=2.2.2",
    "tqdm>=4.67.1",
    "h5py>=3.11.0",
]

[project.optional-dependencies]
colab = ["matplotlib>=3.8", "ipython>=7"]
notebook = ["matplotlib>=3.8", "ipython>=8", "jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5.10"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = [ "tests", ]
python_files = "test_*.py"
python_functions = "test_*"
